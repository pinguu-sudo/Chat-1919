<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>■ 2ちゃんねる風 掲示板システム ■</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #EFEFEF;
            font-family: "MS PGothic", "Osaka", "Hiragino Kaku Gothic ProN", sans-serif;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade {
            animation: fadeIn 0.3s ease-out forwards;
        }
    </style>
<style>html{ color:darkviolet; }</style></head>
<body class="p-2 md:p-6 flex items-center justify-center min-h-screen">

    <div class="max-w-4xl w-full mx-auto bg-white border border-gray-400 p-4 shadow-sm">
        
        <!-- ==================== 認証画面（ログイン / 新規登録タブ） ==================== -->
        <div id="auth-view" class="max-w-md mx-auto my-12 bg-gray-100 border border-gray-400 p-6 shadow-md">
            <h1 class="text-xl font-bold text-red-600 mb-4 text-center border-b-2 border-red-600 pb-2">
                ■ 掲示板 認証システム ■
            </h1>

            <!-- タブ切り替えボタン -->
            <div class="flex border-b border-gray-400 mb-4 text-sm">
                <button id="tab-login-btn" class="flex-1 py-2 font-bold text-center bg-white border-t border-l border-r border-gray-400 text-red-600 cursor-pointer">
                    ログイン
                </button>
                <button id="tab-register-btn" class="flex-1 py-2 font-bold text-center bg-gray-200 text-gray-600 cursor-pointer">
                    新規登録
                </button>
            </div>

            <!-- 1. ログインフォーム -->
            <div id="login-form" class="space-y-3 text-sm">
                <p class="text-xs text-gray-600 mb-2">登録済みのIDとパスワードを入力してください。</p>
                <div>
                    <label class="block font-bold text-gray-700 mb-1">ID:</label>
                    <input type="text" id="login-id" placeholder="あなたのID" class="w-full border border-gray-400 px-3 py-2 bg-white">
                </div>
                <div>
                    <label class="block font-bold text-gray-700 mb-1">パスワード:</label>
                    <input type="password" id="login-pass" placeholder="パスワード" class="w-full border border-gray-400 px-3 py-2 bg-white">
                </div>
                <button id="do-login-btn" class="w-full bg-gradient-to-b from-gray-100 to-gray-300 border border-gray-500 py-2 text-sm font-bold text-black hover:from-gray-200 hover:to-gray-400 active:from-gray-400 active:to-gray-200 cursor-pointer shadow-sm mt-4">
                    ログインして入室
                </button>
            </div>

            <!-- 2. 新規登録フォーム（初期は非表示） -->
            <div id="register-form" class="space-y-3 text-sm hidden">
                <p class="text-xs text-gray-600 mb-2">新しいアカウントを作成します（IDの重複はできません）。</p>
                <div>
                    <label class="block font-bold text-gray-700 mb-1">お名前（ニックネーム）:</label>
                    <input type="text" id="reg-name" placeholder="例：名無しさん" class="w-full border border-gray-400 px-3 py-2 bg-white">
                </div>
                <div>
                    <label class="block font-bold text-gray-700 mb-1">ID（重複不可）:</label>
                    <input type="text" id="reg-id" placeholder="半角英数字などの固有ID" class="w-full border border-gray-400 px-3 py-2 bg-white">
                </div>
                <div>
                    <label class="block font-bold text-gray-700 mb-1">パスワード:</label>
                    <input type="password" id="reg-pass" placeholder="パスワード" class="w-full border border-gray-400 px-3 py-2 bg-white">
                </div>
                <button id="do-register-btn" class="w-full bg-gradient-to-b from-gray-100 to-gray-300 border border-gray-500 py-2 text-sm font-bold text-black hover:from-gray-200 hover:to-gray-400 active:from-gray-400 active:to-gray-200 cursor-pointer shadow-sm mt-4">
                    新規登録して入室
                </button>
            </div>
        </div>

        <!-- ==================== メイン掲示板画面（初期は非表示） ==================== -->
        <div id="main-app-view" class="hidden">
            
            <!-- 上部バー（板選択・ログイン情報・名前変更・ログアウト） -->
            <div class="mb-4 bg-gray-200 border border-gray-400 p-2 text-sm flex flex-wrap items-center justify-between gap-2">
                <div class="flex items-center gap-2">
                    <span class="font-bold text-red-700">■ 板選択：</span>
                    <select id="board-select" class="border border-gray-400 px-2 py-1 bg-white font-bold text-blue-700 cursor-pointer">
                        <option value="zatudan">雑談板</option>
                        <option value="news">ニュース速報板</option>
                        <option value="any">なんでもあり</option>
                        <option value="popular">👑 人気スレッド（1000レス達成）</option>
                    </select>
                </div>
                <div class="flex items-center gap-2 flex-wrap">
                    <span id="user-info-display" class="text-xs font-bold text-gray-700"></span>
                    <button id="change-name-btn" class="bg-gradient-to-b from-gray-100 to-gray-300 border border-gray-500 px-2 py-1 text-xs font-bold text-blue-700 hover:bg-gray-200 cursor-pointer">
                        名前変更
                    </button>
                    <button id="logout-btn" class="bg-gradient-to-b from-gray-100 to-gray-300 border border-gray-500 px-2 py-1 text-xs font-bold text-red-600 hover:bg-gray-200 cursor-pointer">
                        ログアウト
                    </button>
                </div>
            </div>

            <!-- スレッド一覧画面 -->
            <div id="thread-list-view">
                <div class="flex justify-between items-center mb-4 border-b-2 border-red-600 pb-1">
                    <h1 class="text-lg md:text-xl font-bold text-red-600">
                        <span id="board-title-text">■ 雑談板 スレッド一覧 ■</span>
                    </h1>
                </div>

                <!-- 新規スレッド作成フォーム -->
                <div class="bg-gray-100 border border-gray-400 p-3 mb-6 text-sm">
                    <div class="font-bold text-red-700 mb-2">■ 新規スレッド作成</div>
                    <div class="mb-2 flex items-center gap-2">
                        <label class="w-28 font-bold text-gray-700">スレッドタイトル:</label>
                        <input type="text" id="new-thread-title" placeholder="例：〇〇について語るスレッド" class="border border-gray-400 px-2 py-1 flex-1 text-sm bg-white">
                    </div>
                    <div class="mb-2 flex items-start gap-2">
                        <label class="w-28 font-bold text-gray-700 pt-1">最初の本文(1レス目):</label>
                        <textarea id="new-thread-message" rows="2" placeholder="スレッドの最初のメッセージを入力..." class="border border-gray-400 px-2 py-1 flex-1 text-sm resize-none bg-white focus:outline-none"></textarea>
                    </div>
                    <div class="flex justify-end">
                        <button id="create-thread-btn" class="bg-gradient-to-b from-gray-100 to-gray-300 border border-gray-500 px-6 py-1 text-sm font-bold text-black hover:from-gray-200 hover:to-gray-400 active:from-gray-400 active:to-gray-200 cursor-pointer shadow-sm">
                            スレッドを立てる
                        </button>
                    </div>
                </div>

                <!-- スレッド一覧リスト -->
                <div class="font-bold text-gray-800 mb-2">【スレッド一覧（レス数順）】</div>
                <div id="threads-container" class="space-y-2 min-h-[200px] border border-gray-300 p-3 bg-gray-50"></div>
            </div>

            <!-- スレッド詳細・チャット画面 -->
            <div id="thread-detail-view" class="hidden">
                <div class="flex justify-between items-center mb-4 border-b-2 border-red-600 pb-1">
                    <h1 id="active-thread-title" class="text-lg md:text-xl font-bold text-red-600"></h1>
                    <button id="back-to-list-btn" class="bg-gradient-to-b from-gray-100 to-gray-300 border border-gray-500 px-3 py-1 text-xs font-bold text-black hover:from-gray-200 cursor-pointer shadow-sm">
                        &laquo; スレッド一覧に戻る
                    </button>
                </div>

                <!-- レス一覧表示エリア -->
                <div id="chat-container" class="space-y-4 mb-8 min-h-[300px] max-h-[500px] overflow-y-auto border border-gray-300 p-3 bg-white"></div>

                <!-- 投稿フォーム -->
                <div class="bg-gray-100 border border-gray-400 p-3 text-sm">
                    <div class="mb-2 flex items-start gap-2">
                        <label class="w-16 font-bold text-gray-700 pt-1">本文:</label>
                        <textarea id="message-input" rows="3" placeholder="ここにメッセージを入力..." class="border border-gray-400 px-2 py-1 flex-1 text-sm resize-none bg-white focus:outline-none"></textarea>
                    </div>
                    <div class="flex justify-between items-center">
                        <span id="posting-as" class="text-xs text-gray-600 font-bold"></span>
                        <button id="send-btn" class="bg-gradient-to-b from-gray-100 to-gray-300 border border-gray-500 px-6 py-1 text-sm font-bold text-black hover:from-gray-200 hover:to-gray-400 active:from-gray-400 active:to-gray-200 cursor-pointer shadow-sm">
                            書き込む
                        </button>
                    </div>
                </div>
            </div>

        </div>

    </div>

    <!-- Firebase & ロジック -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";
        import { getDatabase, ref, push, set, update, onValue, onChildAdded, off, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAm3rUD0n-7b9syhIKmgp0FLVjiduEk8KY",
          authDomain: "chat-d8eb0.firebaseapp.com",
          databaseURL: "https://chat-d8eb0-default-rtdb.firebaseio.com",
          projectId: "chat-d8eb0",
          storageBucket: "chat-d8eb0.firebasestorage.app",
          messagingSenderId: "1072576882638",
          appId: "1:1072576882638:web:b47c85ba653915891dad9f",
          measurementId: "G-PYFR9KS2ZJ"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getDatabase(app);

        const authView = document.getElementById('auth-view');
        const mainAppView = document.getElementById('main-app-view');
        const tabLoginBtn = document.getElementById('tab-login-btn');
        const tabRegisterBtn = document.getElementById('tab-register-btn');
        const loginForm = document.getElementById('login-form');
        const registerForm = document.getElementById('register-form');

        const loginIdInput = document.getElementById('login-id');
        const loginPassInput = document.getElementById('login-pass');
        const doLoginBtn = document.getElementById('do-login-btn');

        const regNameInput = document.getElementById('reg-name');
        const regIdInput = document.getElementById('reg-id');
        const regPassInput = document.getElementById('reg-pass');
        const doRegisterBtn = document.getElementById('do-register-btn');

        const userInfoDisplay = document.getElementById('user-info-display');
        const changeNameBtn = document.getElementById('change-name-btn');
        const logoutBtn = document.getElementById('logout-btn');

        const boardSelect = document.getElementById('board-select');
        const boardTitleText = document.getElementById('board-title-text');
        const threadListView = document.getElementById('thread-list-view');
        const threadDetailView = document.getElementById('thread-detail-view');
        const threadsContainer = document.getElementById('threads-container');
        const backToListBtn = document.getElementById('back-to-list-btn');

        const newThreadTitleInput = document.getElementById('new-thread-title');
        const newThreadMessageInput = document.getElementById('new-thread-message');
        const createThreadBtn = document.getElementById('create-thread-btn');

        const activeThreadTitle = document.getElementById('active-thread-title');
        const chatContainer = document.getElementById('chat-container');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const postingAs = document.getElementById('posting-as');

        let currentUser = null; // { name, id, timeoutUntil, violationCount }
        let currentBoardId = 'zatudan';
        let currentThreadId = null;
        let threadsRef = null;
        let messagesRef = null;

        // スパム検知・クールダウン用の変数
        let lastSendTime = 0;
        let rapidSendCount = 0;
        let isSending = false;
        let lastThreadCreateTime = 0;

        tabLoginBtn.addEventListener('click', () => {
            loginForm.classList.remove('hidden');
            registerForm.classList.add('hidden');
            tabLoginBtn.className = "flex-1 py-2 font-bold text-center bg-white border-t border-l border-r border-gray-400 text-red-600 cursor-pointer";
            tabRegisterBtn.className = "flex-1 py-2 font-bold text-center bg-gray-200 text-gray-600 cursor-pointer";
        });

        tabRegisterBtn.addEventListener('click', () => {
            registerForm.classList.remove('hidden');
            loginForm.classList.add('hidden');
            tabRegisterBtn.className = "flex-1 py-2 font-bold text-center bg-white border-t border-l border-r border-gray-400 text-red-600 cursor-pointer";
            tabLoginBtn.className = "flex-1 py-2 font-bold text-center bg-gray-200 text-gray-600 cursor-pointer";
        });

        function escapeHtml(str) {
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        function formatDate(timestamp) {
            if (!timestamp) return "";
            const dateObj = new Date(timestamp);
            const y = dateObj.getFullYear();
            const m = String(dateObj.getMonth() + 1).padStart(2, '0');
            const d = String(dateObj.getDate()).padStart(2, '0');
            const h = String(dateObj.getHours()).padStart(2, '0');
            const min = String(dateObj.getMinutes()).padStart(2, '0');
            const dayOfWeek = ['日', '月', '火', '水', '木', '金', '土'][dateObj.getDay()];
            return `${y}/${m}/${d}(${dayOfWeek}) ${h}:${min}`;
        }

        // 新規登録処理
        doRegisterBtn.addEventListener('click', async () => {
            try {
                const name = regNameInput.value.trim();
                const id = regIdInput.value.trim();
                const pass = regPassInput.value.trim();

                if (!name || !id || !pass) {
                    alert("「お名前」「ID」「パスワード」をすべて入力してください。");
                    return;
                }

                const idRef = ref(db, `id_registry/${id}`);
                const snapshot = await get(idRef);

                if (snapshot.exists()) {
                    alert("エラー：このIDはすでに使用されています。");
                    return;
                }

                await set(idRef, {
                    name: name,
                    password: pass,
                    createdAt: Date.now(),
                    violationCount: 0,
                    banned: false
                });

                currentUser = { name: name, id: id, violationCount: 0 };
                enterApp();
            } catch (e) {
                alert("【新規登録エラー】\n" + e.message);
            }
        });

        // ログイン処理
        doLoginBtn.addEventListener('click', async () => {
            try {
                const id = loginIdInput.value.trim();
                const pass = loginPassInput.value.trim();

                if (!id || !pass) {
                    alert("IDとパスワードを入力してください。");
                    return;
                }

                const idRef = ref(db, `id_registry/${id}`);
                const snapshot = await get(idRef);

                if (!snapshot.exists()) {
                    alert("エラー：指定されたIDは登録されていません。");
                    return;
                }

                const data = snapshot.val();
                if (data.banned) {
                    alert("エラー：このアカウントはスパム行為により停止（BAN）されています。");
                    return;
                }

                if (data.password !== pass) {
                    alert("エラー：パスワードが間違っています。");
                    return;
                }

                const userName = (data && data.name) ? data.name : id;
                currentUser = { 
                    name: userName, 
                    id: id, 
                    violationCount: data.violationCount || 0 
                };
                enterApp();
            } catch (e) {
                alert("【ログインエラー】\n" + e.message);
            }
        });

        function enterApp() {
            updateUserDisplay();
            authView.classList.add('hidden');
            mainAppView.classList.remove('hidden');
            showThreadListView();
        }

        function updateUserDisplay() {
            userInfoDisplay.textContent = `ログイン中: ${currentUser.name} (ID: ${currentUser.id})`;
            postingAs.textContent = `投稿者: ${currentUser.name} (ID: ${currentUser.id})`;
        }

        // 名前変更機能
        changeNameBtn.addEventListener('click', async () => {
            const newName = prompt("新しいお名前（ニックネーム）を入力してください:", currentUser.name);
            if (!newName) return;
            const trimmedName = newName.trim();
            if (!trimmedName) {
                alert("名前が空です。");
                return;
            }

            try {
                await update(ref(db, `id_registry/${currentUser.id}`), {
                    name: trimmedName
                });

                const boards = ['zatudan', 'news', 'any'];
                const updates = {};

                for (const boardId of boards) {
                    const threadsSnapshot = await get(ref(db, `boards/${boardId}/threads`));
                    if (threadsSnapshot.exists()) {
                        const threadsData = threadsSnapshot.val();
                        for (const threadId of Object.keys(threadsData)) {
                            const thread = threadsData[threadId];
                            if (thread.creatorId === currentUser.id) {
                                updates[`boards/${boardId}/threads/${threadId}/creator`] = trimmedName;
                            }
                            if (thread.messages) {
                                for (const msgId of Object.keys(thread.messages)) {
                                    const msg = thread.messages[msgId];
                                    if (msg.userId === currentUser.id) {
                                        updates[`boards/${boardId}/threads/${threadId}/messages/${msgId}/username`] = trimmedName;
                                    }
                                }
                            }
                        }
                    }
                }

                if (Object.keys(updates).length > 0) {
                    await update(ref(db), updates);
                }

                currentUser.name = trimmedName;
                updateUserDisplay();
                showThreadListView();
                alert("お名前を変更し、過去の作成スレッドや投稿の名前もすべて更新しました！");
            } catch (e) {
                alert("【名前変更エラー】\n" + e.message);
            }
        });

        logoutBtn.addEventListener('click', () => {
            currentUser = null;
            loginIdInput.value = '';
            loginPassInput.value = '';
            mainAppView.classList.add('hidden');
            authView.classList.remove('hidden');
        });

        function showThreadListView() {
            threadListView.classList.remove('hidden');
            threadDetailView.classList.add('hidden');
            if (messagesRef) off(messagesRef);
            currentThreadId = null;
            loadThreads(currentBoardId);
        }

        function showThreadDetailView(threadId, threadTitle) {
            threadListView.classList.add('hidden');
            threadDetailView.classList.remove('hidden');
            activeThreadTitle.textContent = `■ ${threadTitle} ★ ■`;
            chatContainer.innerHTML = '';
            currentThreadId = threadId;

            messagesRef = ref(db, `boards/${currentBoardId}/threads/${threadId}/messages`);
            
            let resCount = 0;
            onChildAdded(messagesRef, (snapshot) => {
                resCount++;
                const data = snapshot.val();
                if (!data) return;

                const msgDiv = document.createElement('div');
                msgDiv.className = "animate-fade border-b border-gray-300 pb-3 mb-3";

                const timeStr = formatDate(data.createdAt);
                const name = escapeHtml(data.username || "名無しさん");
                const userId = data.userId ? ` ID:${escapeHtml(data.userId)}` : '';
                const text = escapeHtml(data.text || "").replace(/\n/g, '<br>');

                msgDiv.innerHTML = `
                    <div class="text-sm mb-1">
                        <span class="font-bold">${resCount}</span> ：
                        <span class="font-bold text-green-700">${name}</span> ：
                        <span class="text-gray-600">${timeStr}</span>
                        <span class="text-gray-500 font-mono">${userId}</span>
                    </div>
                    <div class="text-sm pl-4 text-gray-900 whitespace-pre-wrap leading-relaxed">${text}</div>
                `;

                chatContainer.appendChild(msgDiv);
                chatContainer.scrollTop = chatContainer.scrollHeight;
            });
        }

        // スレッド一覧の読み込み・ソート・人気スレッド・👑VIP表示処理
        function loadThreads(boardId) {
            let boardName = "雑談板";
            if (boardId === 'news') boardName = "ニュース速報板";
            if (boardId === 'any') boardName = "なんでもあり";
            if (boardId === 'popular') boardName = "👑 人気スレッド（1000レス達成）";
            boardTitleText.textContent = `■ ${boardName} スレッド一覧 ■`;

            threadsContainer.innerHTML = '<div class="text-gray-500 text-sm">スレッド読み込み中...</div>';

            if (boardId === 'popular') {
                // 人気スレッド（1000レス以上達成したスレッドを全板から集める）
                (async () => {
                    try {
                        const boards = ['zatudan', 'news', 'any'];
                        let threadArray = [];
                        for (const bId of boards) {
                            const snap = await get(ref(db, `boards/${bId}/threads`));
                            if (snap.exists()) {
                                const data = snap.val();
                                Object.keys(data).forEach(tId => {
                                    const thread = data[tId];
                                    const count = thread.messages ? Object.keys(thread.messages).length : 0;
                                    if (count >= 1000) {
                                        threadArray.push({ id: tId, boardId: bId, ...thread });
                                    }
                                });
                            }
                        }

                        // レス数が多い順にソート（一番多いスレッドを一番上に）
                        threadArray.sort((a, b) => {
                            const countA = a.messages ? Object.keys(a.messages).length : 0;
                            const countB = b.messages ? Object.keys(b.messages).length : 0;
                            return countB - countA;
                        });

                        threadsContainer.innerHTML = '';
                        if (threadArray.length === 0) {
                            threadsContainer.innerHTML = '<div class="text-gray-500 text-sm">1000レスを達成した人気スレッドはまだありません。</div>';
                            return;
                        }

                        renderThreadList(threadArray);
                    } catch (e) {
                        threadsContainer.innerHTML = '<div class="text-red-500 text-sm">読み込みエラーが発生しました。</div>';
                    }
                })();
            } else {
                // 通常の各板のスレッド読み込み
                threadsRef = ref(db, `boards/${boardId}/threads`);
                onValue(threadsRef, (snapshot) => {
                    threadsContainer.innerHTML = '';
                    const data = snapshot.val();

                    if (!data) {
                        threadsContainer.innerHTML = '<div class="text-gray-500 text-sm">スレッドがまだありません。上のフォームから作成してください。</div>';
                        return;
                    }

                    let threadArray = Object.keys(data).map(tId => ({ id: tId, boardId: boardId, ...data[tId] }));

                    // レス数が多い順にソート（一番多いスレッドを一番上に）
                    threadArray.sort((a, b) => {
                        const countA = a.messages ? Object.keys(a.messages).length : 0;
                        const countB = b.messages ? Object.keys(b.messages).length : 0;
                        return countB - countA;
                    });

                    renderThreadList(threadArray);
                }, { onlyOnce: true });
            }
        }

        // スレッド一覧のHTML描画関数（👑VIPおよびレス数ソート対応）
        function renderThreadList(threadArray) {
            threadArray.forEach((thread) => {
                const threadId = thread.id;
                const targetBoardId = thread.boardId || currentBoardId;
                const title = thread.title || "無題のスレッド";
                const messagesCount = thread.messages ? Object.keys(thread.messages).length : 0;
                let creator = escapeHtml(thread.creator || "名無しさん");

                // 1000レス達成している場合は作成者を「👑VIP」にする
                if (messagesCount >= 1000) {
                    creator = `👑VIP ${creator}`;
                }

                const dateStr = formatDate(thread.createdAt);

                const threadDiv = document.createElement('div');
                threadDiv.className = "animate-fade bg-white border border-gray-300 p-2.5 text-sm flex flex-col sm:flex-row justify-between items-start sm:items-center hover:bg-yellow-50 cursor-pointer shadow-sm gap-1";
                threadDiv.innerHTML = `
                    <div class="flex-1 truncate">
                        <span class="font-bold text-blue-700">${escapeHtml(title)}</span>
                    </div>
                    <div class="flex items-center gap-2 text-xs text-gray-600">
                        <span>作成者: <strong class="text-amber-600">${creator}</strong></span>
                        <span>${dateStr}</span>
                        <span class="bg-gray-200 border border-gray-300 px-2 py-0.5 rounded text-gray-700 whitespace-nowrap font-bold">レス数: ${messagesCount}</span>
                    </div>
                `;

                threadDiv.addEventListener('click', () => {
                    currentBoardId = targetBoardId;
                    boardSelect.value = targetBoardId;
                    showThreadDetailView(threadId, title);
                });

                threadsContainer.appendChild(threadDiv);
            });
        }

        // スパムチェックおよびペナルティ処理関数
        async function checkSpamAndExecute() {
            const now = Date.now();
            
            if (isSending) {
                alert("送信中...");
                throw new Error("STILL_SENDING");
            }

            if (lastSendTime && (now - lastSendTime < 3000)) {
                rapidSendCount++;
            } else {
                rapidSendCount = 1;
            }
            lastSendTime = now;

            if (rapidSendCount >= 20) {
                rapidSendCount = 0; 
                currentUser.violationCount = (currentUser.violationCount || 0) + 1;

                const isBanned = currentUser.violationCount >= 10;
                const timeoutUntilTime = now + 60000;

                await update(ref(db, `id_registry/${currentUser.id}`), {
                    violationCount: currentUser.violationCount,
                    banned: isBanned,
                    timeoutUntil: timeoutUntilTime
                });

                currentUser.timeoutUntil = timeoutUntilTime;

                if (currentThreadId) {
                    const spamMsgRef = ref(db, `boards/${currentBoardId}/threads/${currentThreadId}/messages`);
                    await push(spamMsgRef, {
                        username: "【運営システム】",
                        text: `${currentUser.name}のアカウントは1分間タイムアウトされました 理由:スパム`,
                        userId: "SYSTEM",
                        createdAt: Date.now()
                    });
                }

                if (isBanned) {
                    alert(`【アカウント停止】\nスパム行為の制限（10回）を超えたため、アカウントが停止されました。`);
                    logoutBtn.click();
                    throw new Error("ACCOUNT_BANNED");
                } else {
                    alert(`【スパム検知】\n短時間の連続送信が検知されたため、1分間タイムアウトされました。（違反回数: ${currentUser.violationCount}/10）`);
                    throw new Error("ACCOUNT_TIMEOUT");
                }
            }

            if (currentUser.timeoutUntil && now < currentUser.timeoutUntil) {
                const remainSec = Math.ceil((currentUser.timeoutUntil - now) / 1000);
                alert(`タイムアウト中です。あと ${remainSec} 秒お待ちください。`);
                throw new Error("STILL_TIMEOUT");
            }
        }

        // 新規スレッド作成
        createThreadBtn.addEventListener('click', async () => {
            try {
                const now = Date.now();
                if (lastThreadCreateTime && (now - lastThreadCreateTime < 60000)) {
                    const remainSec = Math.ceil((60000 - (now - lastThreadCreateTime)) / 1000);
                    alert(`スレッドを作成してから1分間は新しいスレッドを作成できません。あと ${remainSec} 秒お待ちください。`);
                    return;
                }

                const title = newThreadTitleInput.value.trim();
                const message = newThreadMessageInput.value.trim();

                if (!title) {
                    alert("スレッドタイトルを入力してください。");
                    return;
                }
                if (!message) {
                    alert("最初の本文を入力してください。");
                    return;
                }

                await checkSpamAndExecute();

                lastThreadCreateTime = Date.now();

                const userName = (currentUser && currentUser.name) ? currentUser.name : "名無しさん";
                const userId = (currentUser && currentUser.id) ? currentUser.id : "unknown";
                const nowTime = Date.now();

                const newThreadRef = push(ref(db, `boards/${currentBoardId}/threads`));
                const threadId = newThreadRef.key;

                await set(ref(db, `boards/${currentBoardId}/threads/${threadId}`), {
                    title: title,
                    creator: userName,
                    creatorId: userId,
                    createdAt: nowTime,
                    messages: {
                        [push(ref(db, `boards/${currentBoardId}/threads/${threadId}/messages`)).key]: {
                            username: userName,
                            text: message,
                            userId: userId,
                            createdAt: nowTime
                        }
                    }
                });

                newThreadTitleInput.value = '';
                newThreadMessageInput.value = '';
                showThreadDetailView(threadId, title);

            } catch (e) {
                if (e.message !== "ACCOUNT_TIMEOUT" && e.message !== "STILL_TIMEOUT" && e.message !== "ACCOUNT_BANNED" && e.message !== "STILL_SENDING") {
                    alert("【スレッド作成エラー】\n" + e.message);
                }
            }
        });

        // メッセージ送信
        async function sendMessage() {
            try {
                const message = messageInput.value.trim();
                if (!message || !currentThreadId) return;

                await checkSpamAndExecute();

                isSending = true;
                sendBtn.textContent = "送信中...";
                sendBtn.disabled = true;

                const userName = (currentUser && currentUser.name) ? currentUser.name : "名無しさん";
                const userId = (currentUser && currentUser.id) ? currentUser.id : "unknown";

                const msgRef = ref(db, `boards/${currentBoardId}/threads/${currentThreadId}/messages`);
                await push(msgRef, {
                    username: userName,
                    text: message,
                    userId: userId,
                    createdAt: Date.now()
                });
                messageInput.value = "";
                messageInput.focus();

                setTimeout(() => {
                    isSending = false;
                    sendBtn.textContent = "書き込む";
                    sendBtn.disabled = false;
                }, 1000);

            } catch (e) {
                isSending = false;
                sendBtn.textContent = "書き込む";
                sendBtn.disabled = false;

                if (e.message !== "ACCOUNT_TIMEOUT" && e.message !== "STILL_TIMEOUT" && e.message !== "ACCOUNT_BANNED" && e.message !== "STILL_SENDING") {
                    alert("【書き込みエラー】\n" + e.message);
                }
            }
        }

        sendBtn.addEventListener('click', sendMessage);

        boardSelect.addEventListener('change', (e) => {
            currentBoardId = e.target.value;
            showThreadListView();
        });

        backToListBtn.addEventListener('click', showThreadListView);
    </script>
